services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_BUILD: ${APP_BUILD:-}
    image: cirurgia-app
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env.docker
    environment:
      TZ: Europe/Lisbon
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # Só acessível a partir do próprio servidor (dados clínicos): nunca expor à rede.
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/dados:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Gestão da base de dados. Por omissão só responde no próprio servidor (acesso por túnel SSH):
  # tem acesso total aos dados clínicos, por isso não se expõe à rede sem proteção.
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 128M
      TZ: Europe/Lisbon
    ports:
      - "${PMA_BIND:-127.0.0.1}:${PMA_PORT:-8083}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  app_storage:
  app_logs:
